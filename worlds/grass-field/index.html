<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <meta name="theme-color" content="#02040b">
    <title>QuickWorlds</title>
    <style>
      html, body, #canvas {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        border: 0;
      }

      body {
        overflow: hidden;
        background: #02040b;
        color: #c9d2c4;
        touch-action: none;
      }

      #canvas {
        display: block;
      }

      #canvas:focus {
        outline: none;
      }

      #quickworlds-loading {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 44%, rgba(26, 42, 49, 0.72), transparent 55%),
          #02040b;
        transition: opacity 800ms ease;
      }

      #quickworlds-loading.ready {
        opacity: 0;
        pointer-events: none;
      }

      #quickworlds-loading.notice {
        background: #160e13;
      }

      .quickworlds-loading__inner {
        width: min(72vw, 420px);
        text-align: center;
      }

      #quickworlds-loading-state {
        min-height: 1.4em;
        margin: 1.1rem 0 0;
        color: #8e9c91;
        font: 12px/1.4 "Courier New", monospace;
        letter-spacing: 0.08em;
      }

      #quickworlds-loading-progress {
        width: min(46vw, 300px);
        height: 2px;
        margin: 0.75rem auto 0;
        overflow: hidden;
        background: #1f302d;
      }

      #quickworlds-loading-progress span {
        display: block;
        width: 0;
        height: 100%;
        background: #91b59b;
        transition: width 120ms linear;
      }

    </style>
    <link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

  </head>
  <body>
    <canvas id="canvas">Your browser does not support the canvas tag.</canvas>
    <noscript>Your browser does not support JavaScript.</noscript>

    <div id="quickworlds-loading" role="status" aria-live="polite">
      <div class="quickworlds-loading__inner">
        <p id="quickworlds-loading-state">loading Grass Field…</p>
        <div id="quickworlds-loading-progress" aria-hidden="true"><span></span></div>
      </div>
    </div>

    <script src="index.js"></script>
    <script>
      (() => {
        "use strict";

        const config = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":21777272,"index.wasm":39514754},"focusCanvas":false,"gdextensionLibs":[],"godotPoolSize":4};
        const overlay = document.getElementById("quickworlds-loading");
        const state = document.getElementById("quickworlds-loading-state");
        const progress = document.querySelector("#quickworlds-loading-progress span");

        const fail = (error) => {
          console.error(error);
          overlay.classList.add("notice");
          state.textContent = error instanceof Error ? error.message : String(error);
        };

        window.addEventListener("quickworld-ready", () => {
          state.textContent = "Grass Field";
          progress.style.width = "100%";
          overlay.classList.add("ready");
          window.setTimeout(() => {
            overlay.remove();
          }, 850);
        }, { once: true });

        const missing = Engine.getMissingFeatures({ threads: false });
        if (missing.length) {
          fail(new Error(`This browser is missing: ${missing.join(", ")}`));
          return;
        }

        const engine = new Engine(config);
        engine.startGame({
          onProgress(current, total) {
            if (current > 0 && total > 0) {
              progress.style.width = `${Math.min(100, (current / total) * 100)}%`;
            }
          },
        }).catch(fail);
      })();
    </script>
  </body>
</html>
