<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <meta name="theme-color" content="#f8f8f4">
    <title>QuickWorlds — Grass Field tuning preview</title>
    <link rel="icon" href="../../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <h1>QuickWorlds</h1>
        <div class="rule rule--ornamented" aria-hidden="true"><span></span></div>
        <p class="subtitle">Grass Field<br>tuning preview</p>
      </header>

      <figure class="labyrinth">
        <img
          src="../../assets/labyrinth-selected-transparent.png"
          width="1825"
          height="862"
          alt="A pixel-art stone labyrinth with evergreen trees, a central pool, and a front entrance"
        >
      </figure>

      <section class="status-box" aria-labelledby="preview-message">
        <span class="globe" aria-hidden="true">🌍</span>
        <p id="preview-message">
          Local staging only.<br>
          This QuickWorld is not published on QuickWorlds.com.
        </p>
      </section>

      <p class="enter-link">
        <a
          href="../../worlds/grass-field/index.html?build=20260904-3&amp;offline=1"
          data-quickworlds-loading
          data-quickworld-url="../../worlds/grass-field/index.html?build=20260904-3"
          data-quickworld-return="./"
          data-canonical-quicktheme
        >[ enter Grass Field ]</a>
      </p>

      <p class="mobile-world-message" data-mobile-world-message tabindex="-1" hidden>
        This QuickWorld is currently available on desktop. Mobile worlds are coming later.
      </p>

      <p class="contact-link"><a href="../../">[ return to website preview ]</a></p>

      <footer>
        <div class="rule" aria-hidden="true"></div>
        <p>&copy; 2026 QuickWorlds</p>
      </footer>
    </main>

    <div
      class="loading-overlay"
      data-loading-overlay
      role="dialog"
      aria-label="QuickWorlds loading sequence"
      aria-modal="true"
      hidden
    >
      <canvas
        class="loading-logo"
        data-loading-logo
        width="1874"
        height="839"
        aria-hidden="true"
      ></canvas>
    </div>

    <script src="../../loading-demo.js"></script>
  </body>
</html>
