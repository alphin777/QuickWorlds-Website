<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="QuickWorlds — browser-based, shareable, immersive spaces. Shared worlds are coming soon.">
    <meta name="theme-color" content="#f8f8f4">
    <title>QuickWorlds</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <h1>QuickWorlds</h1>
        <div class="rule rule--ornamented" aria-hidden="true">
          <span></span>
        </div>
        <p class="subtitle">Browser-based, shareable,<br>immersive spaces.</p>
      </header>

      <figure class="labyrinth">
        <img
          src="assets/labyrinth-selected-transparent.png"
          width="1825"
          height="862"
          alt="A pixel-art stone labyrinth with evergreen trees, a central pool, and a front entrance"
        >
      </figure>

      <section class="status-box" aria-labelledby="construction-message">
        <span class="globe" aria-hidden="true">🌍</span>
        <p id="construction-message">
          QuickWorlds is currently under construction.<br>
          Shared worlds are coming soon.
        </p>
      </section>

      <p class="enter-link"><a href="#coming-soon">[ enter later ]</a></p>

      <section id="coming-soon" class="visually-hidden" aria-label="Coming soon">
        Shared worlds are coming soon.
      </section>

      <p class="contact-link">
        <a href="mailto:hello@quickworlds.com">[ send a message ]</a>
      </p>

      <footer>
        <div class="rule" aria-hidden="true"></div>
        <p>&copy; 2026 QuickWorlds</p>
      </footer>
    </main>
  </body>
</html>
